server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  location /api/ {
    client_max_body_size 6m;
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /driver/ {
    try_files $uri $uri/ /driver/index.html;
  }

  location /manager/ {
    try_files $uri $uri/ /manager/index.html;
  }

  location = /gopark-manager.apk {
    try_files $uri =404;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="gopark-manager.apk"';
    add_header Cache-Control "no-store";
  }

  location = /gopark-manager.zip {
    try_files $uri =404;
    default_type application/zip;
    add_header Content-Disposition 'attachment; filename="gopark-manager.zip"';
    add_header Cache-Control "no-store";
  }

  location = /manager-download.html {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
