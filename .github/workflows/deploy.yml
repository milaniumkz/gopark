name: deploy-production

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/crm-web/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'docker-compose.server.yml'
      - 'scripts/deploy_checked_release.sh'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy
        required: false
        default: main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - name: Resolve commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pack checked commit
        run: tar --exclude='.git' -czf /tmp/gopark-release.tgz .
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload release archive
        env:
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT }}" /tmp/gopark-release.tgz "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/gopark-release-$SHA.tgz"
      - name: Deploy checked commit
        env:
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT }}" scripts/deploy_checked_release.sh "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/gopark-deploy-$SHA.sh"
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.PROD_SSH_PORT }}" "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" "SHA='$SHA' bash /tmp/gopark-deploy-$SHA.sh"
