name: server-ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: status, incident-schema, logs, restart, redeploy, rollback
        required: true
        default: status
      workshop:
        description: Workshop for an explicitly requested vehicle handoff (main, body, both)
        required: false
      vehicle_plate:
        description: Vehicle plate for diagnostics or an explicitly requested handoff
        required: false
      rollback_sha:
        description: Required only for rollback
        required: false

concurrency:
  group: production-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify reset in isolated PostgreSQL
        if: inputs.operation == 'reset-keep-owner'
        run: bash scripts/test_reset_keep_owner.sh
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Run operation
        env:
          OPERATION: ${{ github.event.inputs.operation }}
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
          VEHICLE_PLATE: ${{ github.event.inputs.vehicle_plate }}
          WORKSHOP: ${{ github.event.inputs.workshop }}
        run: |
          [[ "$OPERATION" =~ ^[a-z-]+$ ]]
          [[ -z "$ROLLBACK_SHA" || "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VEHICLE_PLATE" =~ ^[a-zA-Z0-9[:space:]-]{0,32}$ ]]
          [[ -z "$WORKSHOP" || "$WORKSHOP" =~ ^(main|body|both)$ ]]
          RESET_SQL_PATH="/tmp/gopark-owner-reset-$GITHUB_RUN_ID.sql"
          if [ "$OPERATION" = reset-keep-owner ]; then
            scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT }}" scripts/reset_database_keep_owner.sql "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:$RESET_SQL_PATH"
          fi
          OPS_SCRIPT_PATH="/tmp/gopark-server-ops-$GITHUB_RUN_ID.sh"
          scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT }}" scripts/server_ops.sh "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:$OPS_SCRIPT_PATH"
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.PROD_SSH_PORT }}" "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" "OPERATION='$OPERATION' ROLLBACK_SHA='$ROLLBACK_SHA' VEHICLE_PLATE='$VEHICLE_PLATE' WORKSHOP='$WORKSHOP' RESET_SQL_PATH='$RESET_SQL_PATH' bash '$OPS_SCRIPT_PATH'"
