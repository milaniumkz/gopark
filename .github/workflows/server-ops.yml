name: server-ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: status, incident-schema, logs, restart, redeploy, rollback
        required: true
        default: status
      driver_search:
        description: Driver name prefix for read-only payment diagnostics
        required: false
      contract_number:
        description: Explicit contract number for a requested schedule repair
        required: false
      workshop:
        description: Workshop for an explicitly requested vehicle handoff (main, body, both)
        required: false
      vehicle_plate:
        description: Vehicle plate for diagnostics or an explicitly requested handoff
        required: false
      rollback_sha:
        description: Required only for rollback
        required: false

concurrency:
  group: production-ops
  cancel-in-progress: false

jobs:
  ops:
    if: inputs.operation != 'connectivity-mac' && inputs.operation != 'driver-signing-diagnostic'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify reset in isolated PostgreSQL
        if: inputs.operation == 'reset-keep-owner'
        run: bash scripts/test_reset_keep_owner.sh
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Run operation
        env:
          DRIVER_SEARCH: ${{ github.event.inputs.driver_search }}
          OPERATION: ${{ github.event.inputs.operation }}
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
          VEHICLE_PLATE: ${{ github.event.inputs.vehicle_plate }}
          WORKSHOP: ${{ github.event.inputs.workshop }}
          CONTRACT_NUMBER: ${{ github.event.inputs.contract_number }}
        run: |
          [[ "$DRIVER_SEARCH" =~ ^[[:alpha:][:space:]-]{0,64}$ ]]
          [[ -z "$CONTRACT_NUMBER" || "$CONTRACT_NUMBER" =~ ^[0-9]{1,12}$ ]]
          [[ "$OPERATION" =~ ^[a-z-]+$ ]]
          [[ -z "$ROLLBACK_SHA" || "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VEHICLE_PLATE" =~ ^[a-zA-Z0-9[:space:]-]{0,32}$ ]]
          [[ -z "$WORKSHOP" || "$WORKSHOP" =~ ^(main|body|both)$ ]]
          RESET_SQL_PATH="/tmp/gopark-owner-reset-$GITHUB_RUN_ID.sql"
          if [ "$OPERATION" = reset-keep-owner ]; then
            scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT }}" scripts/reset_database_keep_owner.sql "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:$RESET_SQL_PATH"
          fi
          if [ "$OPERATION" = repair-contract-schedule ]; then
            scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT }}" scripts/repair_contract_schedule.mjs "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/gopark-repair-contract-$GITHUB_RUN_ID.mjs"
          fi
          OPS_SCRIPT_PATH="/tmp/gopark-server-ops-$GITHUB_RUN_ID.sh"
          scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT }}" scripts/server_ops.sh "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:$OPS_SCRIPT_PATH"
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.PROD_SSH_PORT }}" "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" "DRIVER_SEARCH='$DRIVER_SEARCH' OPERATION='$OPERATION' CONTRACT_NUMBER='$CONTRACT_NUMBER' REPAIR_SCRIPT_PATH='/tmp/gopark-repair-contract-$GITHUB_RUN_ID.mjs' ROLLBACK_SHA='$ROLLBACK_SHA' VEHICLE_PLATE='$VEHICLE_PLATE' WORKSHOP='$WORKSHOP' RESET_SQL_PATH='$RESET_SQL_PATH' bash '$OPS_SCRIPT_PATH'"

  mac-connectivity:
    if: inputs.operation == 'connectivity-mac'
    runs-on: [milanium-mac-arm64, repo-gopark]
    timeout-minutes: 3
    environment: production
    steps:
      - name: Check configured server without changing it
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/gopark-connectivity.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -p "$PROD_SSH_PORT" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'cat /home/client/gopark-current-sha; curl --max-time 15 -fsS http://127.0.0.1:3000/api/health'

  driver-signing:
    if: inputs.operation == 'driver-signing-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compare original driver signing identities without publishing
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          UPLOAD_KEY: ${{ secrets.GOPARK_DRIVER_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASSWORD: ${{ secrets.GOPARK_DRIVER_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/driver-signing.XXXXXX")
          trap 'rm -rf "$stage"' EXIT
          chmod 700 "$stage"
          printf '%s\n' "$PRIVATE_KEY" > "$stage/key"
          chmod 600 "$stage/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$stage/known_hosts"
          remote="$SSH_USER@$SSH_HOST"
          options=(-i "$stage/key" -o "UserKnownHostsFile=$stage/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          scp "${options[@]}" -P "$SSH_PORT" "$remote:/home/client/gopark-current/gopark-driver.apk" "$stage/installed.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          installed=$("$signer" verify --print-certs "$stage/installed.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
          test -n "$installed"
          echo "Installed driver certificate: $installed"
          ssh "${options[@]}" -p "$SSH_PORT" "$remote" 'find /home/client/gopark/secrets /home/client/.android /home/client/.config/.android /home/client/gopark-releases -maxdepth 4 -type f \( -name "*.jks" -o -name "*.keystore" \) -print 2>/dev/null || true' > "$stage/candidates"
          count=0
          while IFS= read -r candidate; do
            count=$((count+1)); [ "$count" -le 30 ] || break
            scp "${options[@]}" -P "$SSH_PORT" "$remote:$candidate" "$stage/candidate.jks"
            chmod 600 "$stage/candidate.jks"
            if fingerprint=$(keytool -exportcert -alias androiddebugkey -keystore "$stage/candidate.jks" -storepass android 2>/dev/null | sha256sum | cut -d' ' -f1); then
              echo "Server candidate $count public certificate: $fingerprint"
              if [ "$fingerprint" = "$installed" ]; then echo "Matching original driver key found: $candidate"; fi
            fi
          done < "$stage/candidates"
          if [ -n "$UPLOAD_KEY" ] && [ -n "$UPLOAD_PASSWORD" ]; then
            printf '%s' "$UPLOAD_KEY" | base64 --decode > "$stage/upload.jks"
            chmod 600 "$stage/upload.jks"
            fingerprint=$(keytool -exportcert -alias gopark-upload -keystore "$stage/upload.jks" -storepass "$UPLOAD_PASSWORD" 2>/dev/null | sha256sum | cut -d' ' -f1)
            echo "Configured upload public certificate: $fingerprint"
            if [ "$fingerprint" = "$installed" ]; then echo 'Configured driver upload key matches the installed APK.'; fi
          fi
