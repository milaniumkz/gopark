name: publish-manager-screens
on:
  workflow_dispatch:
  push:
    branches: [codex/whatsapp-oct7-fixes]
    paths: [.github/workflows/publish-manager-screens.yml]
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/screenshots-transfer-20261012
      - name: Package demonstration images
        run: |
          set -euo pipefail
          mkdir -p /tmp/screens
          cp brigadir-vse-ekrany.pdf /tmp/screens/
          zip -q /tmp/screens/brigadir-screenshots.zip ./*.png
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoPark: скриншоты бригадира</title><style>body{font:18px system-ui;max-width:600px;margin:40px auto;padding:20px}a{display:block;padding:18px;background:#2879ef;color:white;border-radius:12px;margin:18px 0}</style><h1>Скриншоты бригадирской версии</h1><p>28 скриншотов текущей реализации на демонстрационных данных.</p><a href="/brigadir-vse-ekrany.pdf" download>Скачать PDF</a><a href="/brigadir-screenshots.zip" download>Скачать ZIP</a>' > /tmp/screens/brigadir-screens.html
          cd /tmp/screens
          sha256sum brigadir-vse-ekrany.pdf brigadir-screenshots.zip brigadir-screens.html > SHA256SUMS
      - name: Publish static downloads without changing application
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          remote="$PROD_SSH_USER@$PROD_SSH_HOST"
          stage="/tmp/gopark-screen-downloads-$GITHUB_RUN_ID"
          ssh -p "$PROD_SSH_PORT" "$remote" "mkdir -m 700 '$stage'"
          scp -P "$PROD_SSH_PORT" /tmp/screens/* "$remote:$stage/"
          ssh -p "$PROD_SSH_PORT" "$remote" "STAGE='$stage' bash -s" <<'REMOTE'
          set -euo pipefail
          exec 9>/tmp/gopark-production-deploy.lock
          flock -n 9
          cd "$STAGE"
          sha256sum -c SHA256SUMS
          current=$(readlink -f /home/client/gopark-current)
          backup="/home/client/backups/screen-downloads-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -m 700 "$backup"
          curl --max-time 15 -fsS http://127.0.0.1:3000/api/health >/dev/null
          for file in brigadir-vse-ekrany.pdf brigadir-screenshots.zip brigadir-screens.html; do
            if [ -f "$current/$file" ]; then cp -p "$current/$file" "$backup/$file"; fi
            install -m 644 "$file" "$current/.$file.new"
            docker cp "$current/.$file.new" "gopark-crm-web:/usr/share/nginx/html/.$file.new"
            mv "$current/.$file.new" "$current/$file"
            docker exec gopark-crm-web mv "/usr/share/nginx/html/.$file.new" "/usr/share/nginx/html/$file"
            expected=$(sha256sum "$file" | cut -d' ' -f1)
            actual=$(docker exec gopark-crm-web sha256sum "/usr/share/nginx/html/$file" | cut -d' ' -f1)
            test "$actual" = "$expected"
            curl --max-time 15 -fsSI "http://127.0.0.1:3000/$file" >/dev/null
          done
          curl --max-time 15 -fsS http://127.0.0.1:3000/api/health >/dev/null
          echo 'Screenshot downloads published; application and database unchanged.'
          rm -rf "$STAGE"
          REMOTE
