name: manager-apk
on:
  workflow_dispatch:
  push:
    branches: [codex/incident-history-release]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test manager app
        working-directory: apps/manager-app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build manager APK
        working-directory: apps/manager-app
        run: flutter build apk --release --dart-define=API_BASE_URL=http://185.138.185.36/api --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: gopark-manager-apk
          path: apps/manager-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
