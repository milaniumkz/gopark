name: publish-brigadir-design
on:
  workflow_dispatch:
  push:
    branches: [codex/whatsapp-oct7-fixes]
    paths: [.github/workflows/publish-brigadir-design.yml]
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/brigadir-design-transfer-20261012
      - name: Verify static demonstration assets
        run: |
          set -euo pipefail
          test -s app.html
          test -s index.html
          sha256sum ./*.html ./*.png ./*.pdf > SHA256SUMS
      - name: Publish isolated review page without updating application
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          remote="$PROD_SSH_USER@$PROD_SSH_HOST"
          stage="/tmp/gopark-design-review-$GITHUB_RUN_ID"
          ssh -p "$PROD_SSH_PORT" "$remote" "mkdir -m 700 '$stage'"
          scp -P "$PROD_SSH_PORT" ./*.html ./*.png ./*.pdf SHA256SUMS "$remote:$stage/"
          ssh -p "$PROD_SSH_PORT" "$remote" "STAGE='$stage' bash -s" <<'REMOTE'
          set -euo pipefail
          exec 9>/tmp/gopark-production-deploy.lock
          flock -n 9
          cd "$STAGE"
          sha256sum -c SHA256SUMS
          current=$(readlink -f /home/client/gopark-current)
          folder=brigadir-new-design
          backup="/home/client/backups/brigadir-design-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -m 700 "$backup"
          curl --max-time 15 -fsS http://127.0.0.1:3000/api/health >/dev/null
          if [ -d "$current/$folder" ]; then cp -a "$current/$folder" "$backup/"; fi
          mkdir -p "$current/.$folder.new"
          for file in ./*.html ./*.png ./*.pdf; do install -m 644 "$file" "$current/.$folder.new/"; done
          if [ -d "$current/$folder" ]; then mv "$current/$folder" "$backup/previous-directory"; fi
          mv "$current/.$folder.new" "$current/$folder"
          docker exec gopark-crm-web mkdir -p "/usr/share/nginx/html/.$folder.new"
          docker cp "$current/$folder/." "gopark-crm-web:/usr/share/nginx/html/.$folder.new/"
          if docker exec gopark-crm-web test -d "/usr/share/nginx/html/$folder"; then
            docker exec gopark-crm-web mv "/usr/share/nginx/html/$folder" "/usr/share/nginx/html/.$folder.previous-$(date +%s)"
          fi
          docker exec gopark-crm-web mv "/usr/share/nginx/html/.$folder.new" "/usr/share/nginx/html/$folder"
          for file in index.html app.html home.png brigadir-new-design.pdf; do
            expected=$(sha256sum "$file" | cut -d' ' -f1)
            actual=$(docker exec gopark-crm-web sha256sum "/usr/share/nginx/html/$folder/$file" | cut -d' ' -f1)
            test "$expected" = "$actual"
            curl --max-time 15 -fsSI "http://127.0.0.1:3000/$folder/$file" >/dev/null
          done
          curl --max-time 15 -fsS http://127.0.0.1:3000/api/health >/dev/null
          echo 'Design review page published. CRM, API, APK and database unchanged.'
          rm -rf "$STAGE"
          REMOTE
